<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIMO - Seguimiento de Viaje</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000000; color: #e5e7eb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .card-black { background-color: #121212; border: 1px solid #262626; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto min-h-screen flex flex-col justify-between">
    <div class="space-y-6">
        <!-- Header -->
        <header class="card-black p-4 rounded-xl text-center">
            <h1 class="text-lg font-bold text-white tracking-wider">PRIMO <span class="text-gray-400 font-light">Passenger</span></h1>
            <p id="tripIdDisplay" class="text-xs text-gray-500 font-mono mt-1">Cargando detalles del viaje...</p>
        </header>

        <!-- Estado del Vehículo Card -->
        <div class="card-black p-5 rounded-xl space-y-4 text-center">
            <div id="statusBadge" class="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-neutral-800 text-white tracking-widest uppercase">CONECTANDO...</div>
            <div class="text-3xl animate-bounce" id="carIcon">🚗</div>
            <h2 id="statusTitle" class="text-sm font-medium text-gray-300">Esperando actualización del conductor</h2>
        </div>

        <!-- Barra Recta de Progreso Visual -->
        <div class="card-black p-5 rounded-xl space-y-4">
            <h3 class="text-xs font-semibold uppercase tracking-widest text-gray-400 mb-2">Progreso del Servicio</h3>
            <div class="relative flex items-center justify-between px-2">
                <!-- Línea base gris -->
                <div class="absolute left-4 right-4 h-1 bg-neutral-800 z-0"></div>
                <!-- Puntos de la ruta -->
                <div id="step-1" class="relative z-10 w-7 h-7 rounded-full bg-neutral-800 border-2 border-neutral-700 flex items-center justify-center text-[10px] text-gray-400 font-bold transition">1</div>
                <div id="step-2" class="relative z-10 w-7 h-7 rounded-full bg-neutral-800 border-2 border-neutral-700 flex items-center justify-center text-[10px] text-gray-400 font-bold transition">2</div>
                <div id="step-3" class="relative z-10 w-7 h-7 rounded-full bg-neutral-800 border-2 border-neutral-700 flex items-center justify-center text-[10px] text-gray-400 font-bold transition">3</div>
                <div id="step-4" class="relative z-10 w-7 h-7 rounded-full bg-neutral-800 border-2 border-neutral-700 flex items-center justify-center text-[10px] text-gray-400 font-bold transition">4</div>
            </div>
            <div class="flex justify-between text-[10px] text-gray-500 px-1 font-medium">
                <span>Aceptada</span>
                <span>En Camino</span>
                <span>Afuera</span>
                <span>Viaje</span>
            </div>
        </div>

        <!-- Detalles de Origen y Destino -->
        <div class="card-black p-4 rounded-xl space-y-3 text-xs">
            <div><span class="text-gray-500 block uppercase tracking-wider text-[10px]">Conductor Asignado</span><span id="driverInfo" class="text-white font-semibold text-sm">-</span></div>
            <div><span class="text-gray-500 block uppercase tracking-wider text-[10px]">Origen</span><span id="origenInfo" class="text-gray-300">-</span></div>
            <div><span class="text-gray-500 block uppercase tracking-wider text-[10px]">Destino</span><span id="destinoInfo" class="text-gray-300">-</span></div>
        </div>
    </div>

    <footer class="text-center text-[10px] text-gray-600 py-4">
        PRIMO Black Dispatch System • Seguridad y Confort en Movimiento
    </footer>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbxFkauzvbW00O0qhSgoRgX14caJzsVq_rxkqb_AdTdGxL_MyF92Zf4H4R5ItL6KuoLUmg/exec'; // <--- Mantén tu URL
        const urlParams = new URLSearchParams(window.location.search);
        const tripId = urlParams.get('id');

        if(!tripId) {
            document.getElementById('statusTitle').innerText = "ID de viaje no especificado en el enlace.";
        }

        async function fetchTripDetails() {
            if(!tripId) return;
            try {
                let res = await fetch(API_URL + '?action=getData');
                let data = await res.json();
                let trip = data.carreras.find(c => c.id === tripId);

                if(!trip) {
                    document.getElementById('statusTitle').innerText = "El viaje ya ha sido finalizado o no existe.";
                    return;
                }

                document.getElementById('tripIdDisplay').innerText = `ID: ${trip.id}`;
                document.getElementById('driverInfo').innerText = trip.conductor;
                document.getElementById('origenInfo').innerText = trip.origen;
                document.getElementById('destinoInfo').innerText = trip.destino;
                document.getElementById('statusBadge').innerText = trip.estado;

                // Actualizar interfaz visual según estado
                resetSteps();
                if(trip.estado === 'ASIGNADA') {
                    document.getElementById('statusTitle').innerText = "Conductor asignado. Preparándose.";
                    activateStep(1);
                } else if(trip.estado === 'EN CAMINO') {
                    document.getElementById('statusTitle').innerText = "Su vehículo va en camino al origen.";
                    activateStep(2);
                } else if(trip.estado === 'ESTAMOS AFUERA') {
                    document.getElementById('statusTitle').innerText = "¡El vehículo está esperando afuera!";
                    activateStep(3);
                } else if(trip.estado === 'EMPEZANDO VIAJE') {
                    document.getElementById('statusTitle').innerText = "Viaje en curso hacia el destino.";
                    activateStep(4);
                } else if(trip.estado === 'FINALIZADO') {
                    document.getElementById('statusTitle').innerText = "El viaje ha finalizado. ¡Gracias por viajar con PRIMO!";
                    activateStep(4);
                    document.getElementById('carIcon').innerText = "🏁";
                }
            } catch(e) {
                console.error("Error cargando estado del pasajero", e);
            }
        }

        function resetSteps() {
            for(let i=1; i<=4; i++) {
                let el = document.getElementById('step-' + i);
                el.className = "relative z-10 w-7 h-7 rounded-full bg-neutral-800 border-2 border-neutral-700 flex items-center justify-center text-[10px] text-gray-400 font-bold transition";
            }
        }

        function activateStep(stepNum) {
            for(let i=1; i<=stepNum; i++) {
                let el = document.getElementById('step-' + i);
                el.className = "relative z-10 w-7 h-7 rounded-full bg-white border-2 border-white flex items-center justify-center text-[10px] text-black font-bold shadow-lg shadow-white/20 transition";
            }
        }

        setInterval(fetchTripDetails, 4000);
        fetchTripDetails();
    </script>
</body>
</html>
