<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIMO Driver - Uber Black</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000000; color: #e5e7eb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .card-black { background-color: #121212; border: 1px solid #262626; }
        .input-black { background-color: #1a1a1a; border: 1px solid #333333; color: white; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto space-y-4">
    <!-- Header -->
    <header class="card-black p-4 rounded-xl flex justify-between items-center">
        <div>
            <h1 class="text-base font-bold text-white">PRIMO Driver</h1>
            <select id="myDriverId" onchange="cambiarDriver()" class="mt-1 bg-neutral-900 border border-neutral-700 text-xs text-white p-1 rounded">
                <option value="DRV-1">DRV-1</option>
                <option value="DRV-2">DRV-2</option>
                <option value="DRV-3">DRV-3</option>
                <option value="DRV-4">DRV-4</option>
                <option value="DRV-5">DRV-5</option>
            </select>
        </div>
        <button onclick="toggleActivo()" id="btnActivo" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-neutral-800 text-gray-400 border border-neutral-700">INACTIVO</button>
    </header>

    <!-- Carreras Asignadas -->
    <div class="card-black p-5 rounded-xl space-y-3">
        <h2 class="text-xs font-semibold uppercase tracking-widest text-gray-400">Mis Carreras Asignadas</h2>
        <div id="misCarreras" class="space-y-3">
            <p class="text-xs text-gray-500">Buscando carreras...</p>
        </div>
    </div>

    <!-- Chat con Base -->
    <div class="card-black p-4 rounded-xl space-y-2">
        <h2 class="text-xs font-semibold uppercase tracking-widest text-gray-400">Chat con Base</h2>
        <div id="chatBoxDriver" class="h-24 overflow-y-auto bg-neutral-900 border border-neutral-800 rounded-lg p-2 space-y-1 text-xs"></div>
        <div class="flex gap-2">
            <input type="text" id="chatInputDriver" placeholder="Escribe a Base..." class="flex-1 p-2 rounded-lg input-black text-xs">
            <button onclick="enviarChatDriver()" class="bg-white text-black font-semibold px-3 py-2 rounded-lg text-xs hover:bg-gray-200">Enviar</button>
        </div>
    </div>

    <!-- Walkie-Talkie Driver -->
    <div class="card-black p-5 rounded-xl flex flex-col items-center justify-center space-y-3">
        <h2 class="text-xs font-semibold uppercase tracking-widest text-gray-400 self-start">Walkie-Talkie Conductor</h2>
        <button id="talkBtn" onmousedown="startRecording()" onmouseup="stopRecording()" ontouchstart="startRecording()" ontouchend="stopRecording()" 
            class="w-24 h-24 rounded-full bg-neutral-900 border-2 border-neutral-700 flex flex-col items-center justify-center shadow-xl active:scale-95 transition cursor-pointer select-none">
            <span class="text-[10px] font-bold text-red-500 animate-pulse">HABLAR</span>
            <span class="text-xs font-bold text-white">AUDIO</span>
        </button>
        <p id="walkieStatus" class="text-xs text-gray-500">Mantén presionado para hablar</p>
    </div>

    <audio id="audioPlayer" style="display:none;"></audio>
